spring:
  application:
    name: jobms

  datasource:
    url: jdbc:postgresql://localhost:5432/job
    username: postgres
    password: suvam123

  jpa:
    show-sql: true
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  #config server
  config:
    import:
      optional:configserver:http://localhost:8888
  profiles:
    active:
      dev

server:
  port: 8082

#Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  # Zipkin / Micrometer Tracing
  tracing:
    sampling:
      probability: 1.0

  # Enable Circuit Breaker health indicator
  health:
    circuitbreakers:
      enabled: true

  # Actuator endpoints
  endpoints:
    web:
      exposure:
        include: health

  # Show full health details
  endpoint:
    health:
      show-details: always

# Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      companyBreaker:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slidingWindowType: count_based
        max-attempts: 5
        wait-duration: 2s
  ratelimiter:
    instances:
      companyBreaker:
        limit-for-period: 2
        limit-refresh-period: 4s
        timeout-duration: 2s